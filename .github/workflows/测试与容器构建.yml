name: 测试与容器构建

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 与前端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 算法源码/依赖环境清单.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 算法源码/依赖环境清单.txt pytest

      - name: 检查算法运行环境
        run: python 算法源码/检查运行环境.py

      - name: 运行回归测试
        run: python -m pytest 平台服务/测试/test_合规采集器.py 平台服务/测试/test_数据服务.py 算法源码/测试/test_统一入口.py -q

      - name: 检查前端脚本语法
        run: node --check 前端界面/前端交互逻辑.js

  container:
    name: 构建并验证容器
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 构建镜像
        run: docker build --tag zhixi-lvjian-esg:ci .

      - name: 启动容器
        run: docker run --detach --name esg-ci --publish 8000:8000 zhixi-lvjian-esg:ci

      - name: 等待健康检查
        shell: bash
        run: |
          for attempt in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"; then
              exit 0
            fi
            sleep 2
          done
          docker logs esg-ci
          exit 1

      - name: 输出容器日志
        if: always()
        run: docker logs esg-ci || true

      - name: 清理容器
        if: always()
        run: docker rm --force esg-ci || true
